services:
  postgres:
    image: postgres:16-alpine
    container_name: supply-chain-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supplychain_dev
      POSTGRES_DB: supplychain_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplychain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply-chain-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:supplychain_dev@postgres:5432/supplychain_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6LVymSFqnKXcFghaAdahF_goBvhXgVArd37TmJb88BuoQ}
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./rag:/app/rag

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: supply-chain-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

volumes:
  postgres_data:

